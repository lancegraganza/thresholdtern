name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"
      - run: npm ci
      - run: npm run compact:compile
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run proof:up
      - name: Wait for the local proof server
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:6302/health; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - run: npm run proof:check
      - uses: actions/upload-artifact@v4
        with:
          name: local-proof-evidence
          path: docs/evidence/local-proofs.json
      - name: Stop proof server
        if: always()
        run: docker compose down
